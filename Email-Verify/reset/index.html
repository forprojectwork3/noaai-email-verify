<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – NOA AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ── Reset & Base ───────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Helvetica, Arial, sans-serif;
            background: #090713;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ── Floating Toast ─────────────────────────────────────────────── */
        #noa-toast {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1b3a;
            border: 1px solid #3b3267;
            padding: 13px 26px;
            border-radius: 999px;
            box-shadow: 0 12px 32px rgba(0,0,0,.55),
                        0 0 20px rgba(168,85,247,.25);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: top .45s cubic-bezier(.175,.885,.32,1.275),
                        opacity .3s ease;
        }
        #noa-toast.visible        { top: 24px; opacity: 1; pointer-events: auto; }
        #noa-toast.type-success   { border-color: #22c55e; color: #4ade80; }
        #noa-toast.type-error     { border-color: #ef4444; color: #f87171; }

        /* ── Card ───────────────────────────────────────────────────────── */
        .card {
            background: #131124;
            border: 1px solid #231f42;
            border-radius: 20px;
            padding: 38px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,.6);
            text-align: center;
        }

        .card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 8px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        /* ── Input Groups ───────────────────────────────────────────────── */
        .field {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .field input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            background: #090713;
            border: 1px solid #28234a;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .field input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168,85,247,.2);
        }
        .field input::placeholder { color: #64748b; }

        /* ── Eye Toggle ─────────────────────────────────────────────────── */
        .eye-btn {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color .2s;
        }
        .eye-btn:hover { color: #a855f7; }
        .eye-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            display: inline-block;
        }
        /* slashed-eye hidden by default — !important beats the svg rule above */
        .eye-btn svg.icon-off { display: none !important; }

        /* ── Submit Button ──────────────────────────────────────────────── */
        #submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }
        #submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(168,85,247,.35);
        }
        #submit-btn:active:not(:disabled) { transform: translateY(0); }
        #submit-btn:disabled { opacity: .55; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- ── Toast notification ───────────────────────────────────────────── -->
    <div id="noa-toast" role="alert" aria-live="polite">
        <span id="noa-toast-icon"></span>
        <span id="noa-toast-msg">Notification</span>
    </div>

    <!-- ── Reset card ───────────────────────────────────────────────────── -->
    <div class="card">
        <h1>Reset Password 🔐</h1>
        <p>Enter your new secure password to update your NOA AI account.</p>

        <form id="reset-form" novalidate>

            <!-- New password -->
            <div class="field">
                <input
                    type="password"
                    id="inp-new"
                    placeholder="New Password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
                <button type="button" class="eye-btn" id="eye-new" aria-label="Toggle new password visibility">
                    <!-- open eye -->
                    <svg class="icon-on" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- slashed eye (hidden on load) -->
                    <svg class="icon-off" viewBox="0 0 24 24" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 9.9a3 3 0 0 1 4.24 4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <!-- Confirm password -->
            <div class="field">
                <input
                    type="password"
                    id="inp-confirm"
                    placeholder="Confirm New Password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
                <button type="button" class="eye-btn" id="eye-confirm" aria-label="Toggle confirm password visibility">
                    <svg class="icon-on" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-off" viewBox="0 0 24 24" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 9.9a3 3 0 0 1 4.24 4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <button type="submit" id="submit-btn">Update Password</button>
        </form>
    </div>

    <script>
    (function () {
        'use strict';

        /* ── Supabase client ──────────────────────────────────────────────── */
        var SUPABASE_URL      = 'https://lumbpfcruwjqudtdbkrm.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_mUkwvs-7BXlOQmPTFBcXVQ_VEqmbQz_';
        var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /* ── Auth-state listener: captures #access_token from email link ─── */
        sb.auth.onAuthStateChange(function (event, session) {
            if (event === 'PASSWORD_RECOVERY') {
                // Session is now live – updateUser() will work.
                console.info('[NOA] PASSWORD_RECOVERY session active.');
            }
        });

        /* ── Toast ────────────────────────────────────────────────────────── */
        var _toastTimer = null;
        function showToast(msg, type) {
            var el   = document.getElementById('noa-toast');
            var icon = document.getElementById('noa-toast-icon');
            var txt  = document.getElementById('noa-toast-msg');

            icon.textContent = (type === 'success') ? '✅' : '⚠️';
            txt.textContent  = msg;

            // Remove previous state classes
            el.classList.remove('visible', 'type-success', 'type-error');
            // Force reflow so the re-add triggers the transition
            void el.offsetHeight;
            el.classList.add('visible', 'type-' + type);

            if (_toastTimer) clearTimeout(_toastTimer);
            _toastTimer = setTimeout(function () {
                el.classList.remove('visible', 'type-success', 'type-error');
            }, 4500);
        }

        /* ── Eye-toggle helper ────────────────────────────────────────────── */
        function attachEyeToggle(btnId, inputId) {
            var btn   = document.getElementById(btnId);
            var input = document.getElementById(inputId);
            var on    = btn.querySelector('.icon-on');
            var off   = btn.querySelector('.icon-off');

            // Ensure correct initial state regardless of CSS load order
            on.style.display  = 'inline-block';
            off.style.display = 'none';

            btn.addEventListener('click', function () {
                var isPassword = input.type === 'password';
                // Switch input type
                input.type = isPassword ? 'text' : 'password';
                // Show slash-eye when text is visible, open-eye when hidden
                on.style.display  = isPassword ? 'none'         : 'inline-block';
                off.style.display = isPassword ? 'inline-block' : 'none';
            });
        }

        attachEyeToggle('eye-new',     'inp-new');
        attachEyeToggle('eye-confirm', 'inp-confirm');

        /* ── Form submit ──────────────────────────────────────────────────── */
        var form = document.getElementById('reset-form');
        var btn  = document.getElementById('submit-btn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            var newPwd     = document.getElementById('inp-new').value.trim();
            var confirmPwd = document.getElementById('inp-confirm').value.trim();

            if (newPwd.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }
            if (newPwd !== confirmPwd) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            btn.disabled     = true;
            btn.textContent  = 'Updating…';

            var result = await sb.auth.updateUser({ password: newPwd });

            if (result.error) {
                showToast(result.error.message || 'Update failed. Please try again.', 'error');
                btn.disabled    = false;
                btn.textContent = 'Update Password';
            } else {
                showToast('✅ Password reset successfully!', 'success');
                btn.textContent = 'Done ✓';
                form.reset();
            }
        });

    })();
    </script>
</body>
</html>
