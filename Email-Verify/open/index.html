<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Email Confirmed | NOA AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
