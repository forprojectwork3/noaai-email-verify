<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Authenticated - NOA AI</title>
    <style>
        :root {
            --bg-color: #080510;
            --card-bg: rgba(18, 12, 36, 0.85);
            --primary: #ffd700;
            --accent: #bc13fe;
            --accent-glow: #6b11ff;
            --text-main: #f3edfd;
            --text-muted: #9c8eb9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(107, 17, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(188, 19, 254, 0.12) 0px, transparent 50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(188, 19, 254, 0.25);
            box-shadow: 
                0 8px 32px 0 rgba(107, 17, 255, 0.2),
                inset 0 0 16px rgba(188, 19, 254, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            transform: scale(0.9);
            opacity: 0;
            animation: entryScaleFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes entryScaleFade {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .logo-wrapper {
            margin-bottom: 32px;
            display: inline-block;
            position: relative;
        }

        .logo-hexagon {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px rgba(188, 19, 254, 0.5);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px rgba(188, 19, 254, 0.7);
                transform: scale(1.03);
            }
        }

        .logo-inner {
            font-size: 38px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            letter-spacing: -1px;
            transform: translateY(-1px);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 36px;
        }

        .highlight {
            color: var(--text-main);
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(107, 17, 255, 0.4);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .btn:hover::after {
            left: 120%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(188, 19, 254, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .redirect-notice {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(156, 142, 185, 0.6);
        }

        #countdown {
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-wrapper">
                <div class="logo-hexagon">
                    <span class="logo-inner">N</span>
                </div>
            </div>

            <div class="status-badge">Verified</div>

            <h1>Connection Authenticated!</h1>
            
            <p>
                Thank you for joining <span class="highlight">NOA AI</span>—Good luck on your new journey! 🚀
            </p>

            <a href="myapp://auth-callback" class="btn">
                Return to NOA AI
            </a>

            <div class="redirect-notice">
                You will be redirected automatically in <span id="countdown">5</span> seconds...
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "myapp://auth-callback";
            }
        }, 1000);
    </script>
</body>
</html>
